volumes:
  cal-db-data:

x-app-env: &app-env
  env_file:
    - ./.env.base44-defaults
    - /run/base44/app.env
  environment:
    DATABASE_URL: postgresql://cal:cal_dev_pw@database:5432/calendso
    DATABASE_DIRECT_URL: postgresql://cal:cal_dev_pw@database:5432/calendso
    NEXT_PUBLIC_WEBAPP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    NEXT_PUBLIC_WEBSITE_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    NEXTAUTH_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}/api/auth
    BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    NODE_OPTIONS: --max-old-space-size=8192
    WATCHPACK_POLLING: "true"
    CHOKIDAR_USEPOLLING: "true"
    NEXT_TELEMETRY_DISABLED: "1"

services:
  database:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: cal
      POSTGRES_PASSWORD: cal_dev_pw
      POSTGRES_DB: calendso
    volumes:
      - cal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cal -d calendso"]
      interval: 5s
      timeout: 5s
      retries: 20

  install:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "corepack enable && yarn install --inline-builds"
    <<: *app-env

  migrate:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "corepack enable && yarn workspace @calcom/prisma db-deploy && yarn workspace @calcom/prisma db-seed"
    <<: *app-env
    depends_on:
      database:
        condition: service_healthy
      install:
        condition: service_completed_successfully

  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "corepack enable && yarn workspace @calcom/web dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
